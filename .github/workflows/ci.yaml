name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        # Review pin; replace with the published Common release before merging.
        uses: apeiros-innovations/common/.github/actions/select-checks@d54f74ffaeb28f261c5d277c0af053453c225ef3
        with:
          policy: .github/ci-impact/ci.json

  validate:
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.selected || '{}')['validate'] }}
    needs: ["scope"]
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["scope", "validate", "workflow-quality"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@4be80ca4e32b1478bca8780b479c14bdfca68400 # v1.1.1
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"scope": true, "validate": "${{ fromJSON(needs.scope.outputs.selected || '{}')['validate'] }}", "workflow-quality": "${{ fromJSON(needs.scope.outputs.selected || '{}')['workflow-quality'] }}"}
  workflow-quality:
    if: ${{ needs.scope.result == 'success' && fromJSON(needs.scope.outputs.selected || '{}')['workflow-quality'] }}
    needs: ["scope"]
    name: Workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Compare event commits locally; manual/scheduled runs retain full validation.
      # https://github.com/dorny/paths-filter#supported-workflows
      - name: Detect workflow changes
        id: actionlint-changes
        if: >-
          contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name) && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            workflows:
              - '.github/workflows/**'
              - '**/action.{yaml,yml}'
              - '.github/actionlint.{yaml,yml}'
              - '.shellcheckrc'
              - '.mise/**'
              - '.miserc.toml'
      - name: Check workflow syntax
        if: steps.actionlint-changes.outputs.workflows != 'false'
        uses: reviewdog/action-actionlint/dockerless@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
          annotations: true
