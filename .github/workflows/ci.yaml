name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["validate", "workflow-quality"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@590588b1f1b4304c1908264948fae50e46e78f89 # v1.0.1
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"validate": true, "workflow-quality": true}
  workflow-quality:
    name: Workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Compare event commits locally; manual/scheduled runs retain full validation.
      # https://github.com/dorny/paths-filter#supported-workflows
      - name: Detect workflow changes
        id: actionlint-changes
        if: >-
          contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name) && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            workflows:
              - '.github/workflows/**'
              - '**/action.{yaml,yml}'
              - '.github/actionlint.{yaml,yml}'
              - '.shellcheckrc'
              - '.mise/**'
              - '.miserc.toml'
      - name: Check workflow syntax
        if: steps.actionlint-changes.outputs.workflows != 'false'
        uses: reviewdog/action-actionlint/dockerless@7abf25e1607ec65838b73d0484ff31f8e9499d80 # v1.81.2
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
          annotations: true
