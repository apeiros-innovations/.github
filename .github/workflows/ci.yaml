name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["validate", "workflow-quality"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@590588b1f1b4304c1908264948fae50e46e78f89 # v1.0.1
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"validate": true, "workflow-quality": true}
  workflow-quality:
    name: Workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax
        uses: reviewdog/action-actionlint/dockerless@5d802a8ebdcb24d712925118c3a4596f571d8fcd # v1.81.0
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.31.1
          inputs: .github/workflows
          advanced-security: false
          annotations: true
