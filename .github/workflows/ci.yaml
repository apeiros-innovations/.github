name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    name: Select affected checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      validate: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.unclassified == 'true' || steps.filter.outputs['validate'] == 'true' }}
      workflow-quality: ${{ steps.baseline.outputs.full == 'true' || steps.filter.outputs.unclassified == 'true' || steps.filter.outputs['workflow-quality'] == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check comparison history
        id: baseline
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          NEW_BRANCH: ${{ github.event.created || false }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          full=true
          if [[ "$EVENT" == pull_request || "$EVENT" == push || "$EVENT" == merge_group ]] &&
             [[ "$NEW_BRANCH" != true && "$REF" != refs/tags/* ]] &&
             [[ "$BASE" =~ ^[[:xdigit:]]{40}$ && "$HEAD_SHA" =~ ^[[:xdigit:]]{40}$ ]] &&
             git cat-file -e "$BASE^{commit}" && git cat-file -e "$HEAD_SHA^{commit}"; then
            if [[ "$EVENT" == pull_request ]]; then
              if git merge-base "$BASE" "$HEAD_SHA" >/dev/null; then full=false; fi
            elif git merge-base --is-ancestor "$BASE" "$HEAD_SHA"; then
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - name: Detect changed paths
        id: filter
        if: steps.baseline.outputs.full == 'false'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          predicate-quantifier: some-with-excludes
          filters: .github/paths/ci.yaml

  validate:
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs['validate'] == 'true') }}
    needs: ["scope"]
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: '**/*.md'
  status:
    name: Build Success
    if: ${{ always() }}
    needs: ["scope", "validate", "workflow-quality"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Require every selected check
        uses: apeiros-innovations/common/.github/actions/ci-gate@089f4fcd7102868a7ca99e98985b5662a5a05251 # v2.0.0
        with:
          needs: ${{ toJSON(needs) }}
          expected: >-
            {"scope": true, "validate": "${{ (needs.scope.outputs['validate'] == 'true') }}", "workflow-quality": "${{ (needs.scope.outputs['workflow-quality'] == 'true') }}"}
  workflow-quality:
    if: ${{ needs.scope.result == 'success' && (needs.scope.outputs['workflow-quality'] == 'true') }}
    needs: ["scope"]
    name: Workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Compare event commits locally; manual/scheduled runs retain full validation.
      # https://github.com/dorny/paths-filter#supported-workflows
      - name: Detect workflow changes
        id: actionlint-changes
        if: >-
          contains(fromJSON('["pull_request", "push", "merge_group"]'), github.event_name) && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            workflows:
              - '.github/workflows/**'
              - '**/action.{yaml,yml}'
              - '.github/actionlint.{yaml,yml}'
              - '.shellcheckrc'
              - '.mise/**'
              - '.miserc.toml'
      - name: Check workflow syntax
        if: steps.actionlint-changes.outputs.workflows != 'false'
        uses: reviewdog/action-actionlint/dockerless@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: any
      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # renovate: datasource=github-releases depName=zizmorcore/zizmor
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
          annotations: true
